name: ci

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

env:
  MULTI_ACCOUNT_COMMON_RUST_TESTS: |
    runtime::auth::tests::multi_account_migration_converts_canonical_v1_records_and_preserves_revalidation_eligibility
    runtime::auth::tests::multi_account_registry_initializes_reserved_defaults_and_allocates_same_provider_profiles
    runtime::auth::tests::multi_account_registry_separates_revisions_and_prevents_aba_across_restart
    runtime::auth::tests::multi_account_restart_requires_fresh_validation_for_connected_generated_profiles
    runtime::auth::tests::multi_account_registry_set_default_is_metadata_only_and_protects_reserved_ambient
    runtime::auth::tests::account_owned_ipc_lease_authorization_requires_exact_connected_current_tuple
    runtime::auth::tests::account_owned_ipc_exact_lease_guard_rejects_stale_tuple_before_runtime_work
    runtime::auth::tests::codex_account_context_pins_exact_home_and_removes_conflicting_child_credentials
    runtime::auth::tests::claude_account_context_owned_profile_is_cli_only_and_sets_exact_scrubbed_root
    runtime::auth::tests::account_owned_ipc_snapshot_serializes_every_revision_as_a_decimal_string
    runtime::auth::tests::authorized_profile_operation_holds_the_exact_lease_through_the_job_create_boundary
    runtime::auth::tests::authorized_profile_operation_never_calls_the_job_boundary_for_stale_or_disconnected_leases
    tests::account_owned_ipc_profile_list_serializes_large_revisions_as_decimal_strings
    tests::account_owned_ipc_context_capture_rejects_a_different_lease_tuple
    tests::authorized_agent_job_ipc_rejects_whitespace_ambiguous_session_ownership
    tests::legacy_provider_only_agent_commands_share_one_fail_closed_boundary

jobs:
  version-check:
    name: Version bump check
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version bump and sync
        shell: bash
        run: |
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg_version="$(node -p "require('./package.json').version")"

          if [ -z "$tauri_version" ] || [ "$tauri_version" = "undefined" ]; then
            echo "Could not read version from src-tauri/tauri.conf.json." >&2
            exit 1
          fi

          echo "PR src-tauri/tauri.conf.json version: ${tauri_version}"
          echo "PR package.json version:            ${pkg_version}"

          # (b) package.json and tauri.conf.json versions must match.
          if [ "$pkg_version" != "$tauri_version" ]; then
            echo "Version mismatch: package.json (${pkg_version}) != src-tauri/tauri.conf.json (${tauri_version})." >&2
            exit 1
          fi

          git fetch --no-tags origin master --depth=1
          base_version="$(git show origin/master:src-tauri/tauri.conf.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")"
          echo "origin/master version:              ${base_version}"

          # (a) The PR version must be strictly greater than origin/master.
          if [ "$tauri_version" = "$base_version" ]; then
            echo "Version not bumped: src-tauri/tauri.conf.json is still ${tauri_version} on origin/master. Bump it before merging into master." >&2
            exit 1
          fi

          highest="$(printf '%s\n%s\n' "$base_version" "$tauri_version" | sort -V | tail -n1)"
          if [ "$highest" != "$tauri_version" ]; then
            echo "Version regression: ${tauri_version} is not greater than origin/master version ${base_version}." >&2
            exit 1
          fi

          echo "Version ${tauri_version} is a valid bump over origin/master ${base_version}."

  validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Native multi-account Rust tests
        shell: bash
        env:
          MULTI_ACCOUNT_PLATFORM_RUST_TESTS: |
            runtime::auth::tests::multi_account_profile_lifecycle_provisions_and_persists_codex_metadata_atomically
            runtime::auth::tests::claude_account_context_revalidates_owned_permissions_and_symlink_identity_before_spawn
            runtime::auth::tests::multi_account_auth_store_hardens_existing_file_to_owner_only_mode
            runtime::auth::tests::codex_account_context_concurrent_a_b_children_keep_exact_isolated_environments
            runtime::auth::tests::claude_account_context_concurrent_a_b_children_keep_exact_isolated_roots
        run: |
          set -euo pipefail
          selected_tests="${MULTI_ACCOUNT_COMMON_RUST_TESTS}"$'\n'"${MULTI_ACCOUNT_PLATFORM_RUST_TESTS}"
          test_list="$(mktemp)"
          trap 'rm -f "$test_list"' EXIT
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --list > "$test_list"
          selected_count=0
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            selected_count=$((selected_count + 1))
            grep -Fqx "${test_name}: test" "$test_list" || {
              echo "Configured Rust test was not discovered: ${test_name}" >&2
              exit 1
            }
          done <<< "$selected_tests"
          [ "$selected_count" -gt 0 ] || {
            echo "No native multi-account Rust tests were selected." >&2
            exit 1
          }
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            cargo test --manifest-path src-tauri/Cargo.toml --lib "$test_name" -- --exact --test-threads=1
          done <<< "$selected_tests"

      - name: Playwright E2E
        run: npm run test:e2e

  windows-install-smoke:
    name: Windows install smoke
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows app without bundling
        run: npm run tauri:build

      - name: Native multi-account Rust tests
        shell: bash
        env:
          MULTI_ACCOUNT_PLATFORM_RUST_TESTS: |
            runtime::auth::tests::multi_account_profile_lifecycle_windows_applies_and_verifies_owner_only_acl
            runtime::auth::tests::codex_account_context_windows_root_revalidation_blocks_cmd_launch
            runtime::auth::tests::claude_account_context_windows_root_replacement_fails_before_cmd_spawn
            runtime::auth::tests::codex_account_context_windows_concurrent_a_b_cmd_children_stay_isolated
            runtime::auth::tests::claude_account_context_windows_concurrent_a_b_node_children_stay_isolated
        run: |
          set -euo pipefail
          selected_tests="${MULTI_ACCOUNT_COMMON_RUST_TESTS}"$'\n'"${MULTI_ACCOUNT_PLATFORM_RUST_TESTS}"
          test_list="$(mktemp)"
          trap 'rm -f "$test_list"' EXIT
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --list > "$test_list"
          selected_count=0
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            selected_count=$((selected_count + 1))
            grep -Fqx "${test_name}: test" "$test_list" || {
              echo "Configured Rust test was not discovered: ${test_name}" >&2
              exit 1
            }
          done <<< "$selected_tests"
          [ "$selected_count" -gt 0 ] || {
            echo "No native multi-account Rust tests were selected." >&2
            exit 1
          }
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            cargo test --manifest-path src-tauri/Cargo.toml --lib "$test_name" -- --exact --test-threads=1
          done <<< "$selected_tests"

      # The lib test binary has been dying at load time with
      # 0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND, which means it imports a symbol
      # that the target DLL does not export. windows-sys links via
      # `kind = "raw-dylib"`, so such a mismatch links cleanly and only fails
      # when the process starts. Diff the import table against the real exports
      # to name the offending symbol instead of guessing.
      - name: Diagnose Windows loader failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $exe = Get-ChildItem -Path "src-tauri/target/debug/deps" -Filter "gtum_lib-*.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { Write-Host "No gtum_lib test binary found; nothing to diagnose."; exit 0 }
          Write-Host "Test binary: $($exe.FullName)"

          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--list' -PassThru -Wait -NoNewWindow
          Write-Host ("Loader exit code: 0x{0:X8}" -f $proc.ExitCode)

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { Write-Host "vswhere not found; cannot locate dumpbin."; exit 0 }
          $vsPath = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "dumpbin not found; cannot inspect imports."; exit 0 }

          # Parse `dumpbin /imports` into a dll -> [function] map.
          $imports = @{}
          $currentDll = $null
          & $dumpbin.FullName /nologo /imports $exe.FullName | ForEach-Object {
            $line = $_
            if ($line -match '^\s{4}(\S+\.dll)\s*$') {
              $currentDll = $Matches[1]
              $imports[$currentDll] = New-Object System.Collections.Generic.List[string]
            }
            elseif ($currentDll -and $line -match '^\s+[0-9A-Fa-f]+\s+([A-Za-z_][A-Za-z0-9_@?$]*)\s*$') {
              $imports[$currentDll].Add($Matches[1])
            }
          }

          Write-Host "`n=== Imported DLLs ==="
          $imports.Keys | Sort-Object | ForEach-Object { Write-Host ("  {0,-40} {1} symbols" -f $_, $imports[$_].Count) }

          Write-Host "`n=== Unresolvable imports ==="
          $found = $false
          foreach ($dll in ($imports.Keys | Sort-Object)) {
            $dllPath = Join-Path $env:SystemRoot "System32\$dll"
            if (-not (Test-Path $dllPath)) {
              Write-Host "  MISSING DLL: $dll (not in System32; may resolve beside the exe)"
              $found = $true
              continue
            }
            $exports = & $dumpbin.FullName /nologo /exports $dllPath |
              ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $Matches[1] } }
            $exportSet = [System.Collections.Generic.HashSet[string]]::new([string[]]$exports)
            foreach ($fn in $imports[$dll]) {
              if (-not $exportSet.Contains($fn)) {
                Write-Host "  MISSING ENTRYPOINT: $dll -> $fn"
                $found = $true
              }
            }
          }
          if (-not $found) { Write-Host "  none (all static imports resolve; the failure is likely in a delay-loaded or dependent DLL)" }

  macos-install-smoke:
    name: macOS install smoke
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS app without bundling
        run: npm run tauri:build

      - name: Native multi-account Rust tests
        shell: bash
        env:
          MULTI_ACCOUNT_PLATFORM_RUST_TESTS: |
            runtime::auth::tests::multi_account_profile_lifecycle_provisions_and_persists_codex_metadata_atomically
            runtime::auth::tests::multi_account_profile_lifecycle_macos_rejects_extended_directory_acl
            runtime::auth::tests::claude_account_context_restored_owned_profile_fails_closed_on_macos
            runtime::auth::tests::multi_account_auth_store_hardens_existing_file_to_owner_only_mode
            runtime::auth::tests::codex_account_context_concurrent_a_b_children_keep_exact_isolated_environments
        run: |
          set -euo pipefail
          selected_tests="${MULTI_ACCOUNT_COMMON_RUST_TESTS}"$'\n'"${MULTI_ACCOUNT_PLATFORM_RUST_TESTS}"
          test_list="$(mktemp)"
          trap 'rm -f "$test_list"' EXIT
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --list > "$test_list"
          selected_count=0
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            selected_count=$((selected_count + 1))
            grep -Fqx "${test_name}: test" "$test_list" || {
              echo "Configured Rust test was not discovered: ${test_name}" >&2
              exit 1
            }
          done <<< "$selected_tests"
          [ "$selected_count" -gt 0 ] || {
            echo "No native multi-account Rust tests were selected." >&2
            exit 1
          }
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            cargo test --manifest-path src-tauri/Cargo.toml --lib "$test_name" -- --exact --test-threads=1
          done <<< "$selected_tests"
