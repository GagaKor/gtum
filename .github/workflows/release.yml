name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_ref:
        description: Branch or ref to publish, for example `master`
        required: false
        default: master
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build and Publish (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish Tauri build to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: gtum v__VERSION__
          releaseBody: |
            Automated GitHub Release generated from a merge into `master`.

            This workflow publishes the application version declared in `src-tauri/tauri.conf.json`.

            Included artifacts depend on the runner platform:
            - Ubuntu: AppImage / deb / rpm where available
            - Windows: installer executable artifacts
            - macOS: unsigned app bundle / dmg artifacts
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify macOS install artifacts
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app_artifacts="$(find src-tauri/target -path '*/bundle/macos/*' -name '*.app' -print)"
          dmg_artifacts="$(find src-tauri/target -path '*/bundle/dmg/*' -name '*.dmg' -print)"

          if [ -z "$app_artifacts" ]; then
            echo "Expected at least one macOS .app artifact under src-tauri/target/*/bundle/macos, but none were found." >&2
            exit 1
          fi

          if [ -z "$dmg_artifacts" ]; then
            echo "Expected at least one macOS .dmg artifact under src-tauri/target/*/bundle/dmg, but none were found." >&2
            exit 1
          fi

          {
            echo "### macOS install artifacts"
            echo
            echo "#### .app"
            printf '%s\n' "$app_artifacts"
            echo
            echo "#### .dmg"
            printf '%s\n' "$dmg_artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
