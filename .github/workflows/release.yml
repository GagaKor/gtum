name: Release

on:
  # Release only after `ci` has finished successfully on master. Triggering on a
  # raw `push` would publish binaries from a commit whose tests never ran.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_ref:
        description: Branch or ref to publish, for example `master`
        required: false
        default: master
        type: string

permissions:
  contents: write

jobs:
  guard:
    name: Guard release tag
    # `workflow_run` fires for failed runs too, so gate on the conclusion.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04

    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve release ref
        id: resolve
        shell: bash
        env:
          # On `workflow_run` the default GITHUB_REF points at the default branch,
          # not the commit that was tested, so pin to the tested SHA explicitly.
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$RELEASE_REF" ]; then
            echo "Could not resolve a ref to release." >&2
            exit 1
          fi
          echo "release_ref=${RELEASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.release_ref }}

      - name: Fail if release tag already exists
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "Could not read version from src-tauri/tauri.conf.json." >&2
            exit 1
          fi

          tag="v${version}"
          echo "Resolved release tag: ${tag}"

          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "Release tag ${tag} already exists on origin. Bump the version in src-tauri/tauri.conf.json (and package.json) before releasing." >&2
            exit 1
          fi

          echo "Release tag ${tag} is available."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Build and Publish (${{ matrix.platform }})
    needs: guard
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish Tauri build to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: gtum v__VERSION__
          releaseBody: |
            Automated GitHub Release generated from a merge into `master`.

            This workflow publishes the application version declared in `src-tauri/tauri.conf.json`.

            Included artifacts depend on the runner platform:
            - Ubuntu: AppImage / deb / rpm where available
            - Windows: installer artifacts
            - macOS: unsigned app bundle / dmg artifacts
          # Stay a draft until every platform has built AND passed artifact
          # verification. The `publish-release` job flips this at the very end,
          # so a partial or unverified release is never publicly visible.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify Linux install artifacts
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          appimage_artifacts="$(find src-tauri/target -path '*/bundle/*' -name '*.AppImage' -print)"
          deb_artifacts="$(find src-tauri/target -path '*/bundle/*' -name '*.deb' -print)"
          rpm_artifacts="$(find src-tauri/target -path '*/bundle/*' -name '*.rpm' -print)"

          if [ -z "$appimage_artifacts" ] && [ -z "$deb_artifacts" ] && [ -z "$rpm_artifacts" ]; then
            echo "Expected at least one Linux AppImage, .deb, or .rpm artifact under src-tauri/target/*/bundle, but none were found." >&2
            exit 1
          fi

          {
            echo "### Linux install artifacts"
            echo
            if [ -n "$appimage_artifacts" ]; then
              echo "#### AppImage"
              printf '%s\n' "$appimage_artifacts"
              echo
            fi
            if [ -n "$deb_artifacts" ]; then
              echo "#### .deb"
              printf '%s\n' "$deb_artifacts"
              echo
            fi
            if [ -n "$rpm_artifacts" ]; then
              echo "#### .rpm"
              printf '%s\n' "$rpm_artifacts"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Windows install artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target" -Recurse -File |
            Where-Object {
              $_.FullName -match "[\\/](bundle)[\\/]" -and
              $_.Extension -in @(".exe", ".msi")
            }

          if (-not $artifacts) {
            Write-Error "Expected at least one Windows .exe or .msi installer artifact under src-tauri/target/*/bundle, but none were found."
            exit 1
          }

          "### Windows install artifacts" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          $artifacts | ForEach-Object { $_.FullName } >> $env:GITHUB_STEP_SUMMARY

      - name: Verify macOS install artifacts
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app_artifacts="$(find src-tauri/target -path '*/bundle/macos/*' -name '*.app' -print)"
          dmg_artifacts="$(find src-tauri/target -path '*/bundle/dmg/*' -name '*.dmg' -print)"

          if [ -z "$app_artifacts" ]; then
            echo "Expected at least one macOS .app artifact under src-tauri/target/*/bundle/macos, but none were found." >&2
            exit 1
          fi

          if [ -z "$dmg_artifacts" ]; then
            echo "Expected at least one macOS .dmg artifact under src-tauri/target/*/bundle/dmg, but none were found." >&2
            exit 1
          fi

          {
            echo "### macOS install artifacts"
            echo
            echo "#### .app"
            printf '%s\n' "$app_artifacts"
            echo
            echo "#### .dmg"
            printf '%s\n' "$dmg_artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish release
    # Runs only when every matrix leg built and verified its artifacts, so the
    # release goes public as a complete set or not at all.
    needs: [guard, publish-tauri]
    runs-on: ubuntu-22.04

    steps:
      - name: Promote draft release to published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Guard job did not produce a release tag." >&2
            exit 1
          fi

          echo "Publishing draft release ${TAG}"
          gh release edit "$TAG" --draft=false

          {
            echo "### Published release"
            echo
            echo "[$TAG](https://github.com/${GH_REPO}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
