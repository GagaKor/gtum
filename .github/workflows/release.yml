name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_ref:
        description: Branch or ref to publish, for example `master`
        required: false
        default: master
        type: string

permissions:
  contents: write

jobs:
  guard:
    name: Guard release tag
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Fail if release tag already exists
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "Could not read version from src-tauri/tauri.conf.json." >&2
            exit 1
          fi

          tag="v${version}"
          echo "Resolved release tag: ${tag}"

          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "Release tag ${tag} already exists on origin. Bump the version in src-tauri/tauri.conf.json (and package.json) before releasing." >&2
            exit 1
          fi

          echo "Release tag ${tag} is available."

  publish-tauri:
    name: Build and Publish (${{ matrix.platform }})
    needs: guard
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # macOS leg builds a universal binary so a single update channel serves
      # both Apple Silicon (aarch64) and Intel (x86_64). Both Rust std targets
      # must be present for `--target universal-apple-darwin` to link.
      - name: Add macOS universal Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish Tauri build to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing keys. With bundle.createUpdaterArtifacts enabled,
          # tauri-action signs the bundles and publishes `latest.json` (the
          # updater manifest) as a release asset automatically.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: gtum v__VERSION__
          releaseBody: |
            Automated GitHub Release generated from a merge into `master`.

            This workflow publishes the application version declared in `src-tauri/tauri.conf.json`.

            Included artifacts depend on the runner platform:
            - Ubuntu: AppImage / deb / rpm where available
            - Windows: installer artifacts
            - macOS: unsigned app bundle / dmg artifacts
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify Linux install artifacts
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          appimage_artifacts="$(find src-tauri/target -path '*/bundle/*' -name '*.AppImage' -print)"
          deb_artifacts="$(find src-tauri/target -path '*/bundle/*' -name '*.deb' -print)"
          rpm_artifacts="$(find src-tauri/target -path '*/bundle/*' -name '*.rpm' -print)"

          if [ -z "$appimage_artifacts" ] && [ -z "$deb_artifacts" ] && [ -z "$rpm_artifacts" ]; then
            echo "Expected at least one Linux AppImage, .deb, or .rpm artifact under src-tauri/target/*/bundle, but none were found." >&2
            exit 1
          fi

          {
            echo "### Linux install artifacts"
            echo
            if [ -n "$appimage_artifacts" ]; then
              echo "#### AppImage"
              printf '%s\n' "$appimage_artifacts"
              echo
            fi
            if [ -n "$deb_artifacts" ]; then
              echo "#### .deb"
              printf '%s\n' "$deb_artifacts"
              echo
            fi
            if [ -n "$rpm_artifacts" ]; then
              echo "#### .rpm"
              printf '%s\n' "$rpm_artifacts"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Windows install artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target" -Recurse -File |
            Where-Object {
              $_.FullName -match "[\\/](bundle)[\\/]" -and
              $_.Extension -in @(".exe", ".msi")
            }

          if (-not $artifacts) {
            Write-Error "Expected at least one Windows .exe or .msi installer artifact under src-tauri/target/*/bundle, but none were found."
            exit 1
          }

          "### Windows install artifacts" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          $artifacts | ForEach-Object { $_.FullName } >> $env:GITHUB_STEP_SUMMARY

      - name: Verify macOS install artifacts
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app_artifacts="$(find src-tauri/target -path '*/bundle/macos/*' -name '*.app' -print)"
          dmg_artifacts="$(find src-tauri/target -path '*/bundle/dmg/*' -name '*.dmg' -print)"

          if [ -z "$app_artifacts" ]; then
            echo "Expected at least one macOS .app artifact under src-tauri/target/*/bundle/macos, but none were found." >&2
            exit 1
          fi

          if [ -z "$dmg_artifacts" ]; then
            echo "Expected at least one macOS .dmg artifact under src-tauri/target/*/bundle/dmg, but none were found." >&2
            exit 1
          fi

          {
            echo "### macOS install artifacts"
            echo
            echo "#### .app"
            printf '%s\n' "$app_artifacts"
            echo
            echo "#### .dmg"
            printf '%s\n' "$dmg_artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
